name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Importar projeto
        run: godot --headless --import

      - name: Scripts sem erro de análise
        run: godot --headless -s res://sim/check.gd

      - name: Testes (GUT)
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit

  # Simulação de balanceamento: só informa (não bloqueia nada) e é lenta, então roda em
  # paralelo, fora do caminho do APK e do release. Na branch principal e quando pedida à
  # mão; nos PRs e nas outras branches, rode localmente (README, "Rodar").
  simulation:
    name: Simulação
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Importar projeto
        run: godot --headless --import

      - name: Simulação de balanceamento
        run: |
          # Bot antigo, uma porta fixa (compara as portas).
          for d in facil normal dificil; do
            godot --headless -s res://sim/simulate.gd -- --runs=300 --seed=1 --bot=old --door=$d | tee -a simulation.txt
          done
          # Bot novo (porta pela vida), cada jogável.
          for c in sorcerer assassin metallurgist vampire barbarian; do
            godot --headless -s res://sim/simulate.gd -- --runs=300 --seed=1 --char=$c | tee -a simulation.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: simulacao
          path: simulation.txt

  android:
    name: APK
    needs: test
    permissions:
      contents: write ## Publicar o pré-lançamento da branch e os releases (tag ou versão nova).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Componentes do Android SDK
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Instalar Godot e templates de exportação
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      # version/code = número do run (sobe a cada build; o Android não instala código menor).
      # Tag v1.2.3: version/name e application/config/version viram 1.2.3 e o APK sai em release.
      # Push na branch principal com uma config/version que ainda não tem tag (alguém subiu a
      # versão): o APK sai em release e o passo "Publicar release automático" cria a tag.
      # Outras branches: mantêm a versão do project.godot e saem em debug.
      - name: Versão
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          CODE="$GITHUB_RUN_NUMBER"
          CUR=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" = "$MAIN" ] \
            && [[ "$CUR" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]] \
            && ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$CUR" > /dev/null 2>&1; then
            echo "Versão $CUR sem tag na branch principal: release automático v$CUR."
            echo "AUTO_TAG=v$CUR" >> "$GITHUB_ENV"
            NAME="$CUR"
            MODE=release
          elif [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            if ! [[ "$NAME" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
              echo "Tag fora do formato v1.2.3: $GITHUB_REF_NAME"; exit 1
            fi
            MODE=release
            sed -i "s/^config\/version=.*/config\/version=\"$NAME\"/" project.godot
          else
            NAME=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
            MODE=debug
          fi
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$NAME\"/" export_presets.cfg
          grep -E "^config/version" project.godot
          grep -E "^version/(code|name)" export_presets.cfg
          echo "APK_MODE=$MODE" >> "$GITHUB_ENV"
          echo "APK_VERSION=$NAME" >> "$GITHUB_ENV"

      # Chave fixa dos secrets: todo APK sai com a mesma assinatura e instala por cima do
      # anterior (o save fica). Sem os secrets (ex.: PR de fork), branches usam uma chave
      # descartável e a tag falha.
      - name: Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/app.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null
          elif [ "$APK_MODE" = release ]; then
            echo "::error::Faltam os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_ALIAS."
            exit 1
          else
            echo "::warning::Sem os secrets da keystore: APK com chave descartável (não instala por cima)."
            KS_PASS=android
            KS_ALIAS=androiddebugkey
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" \
              -keypass "$KS_PASS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "::add-mask::$KS_PASS"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$KS_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KS_PASS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS"
          } >> "$GITHUB_ENV"

      - name: Exportar APK
        run: |
          godot --headless --import
          mkdir -p build
          godot --headless --export-$APK_MODE "Android" build/dicemaxxing.apk
          ls -la build
          unzip -l build/dicemaxxing.apk | grep -E "texts_pt_br|\.pck" || (echo "Textos não exportados"; exit 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs build/dicemaxxing.apk | grep -E "SHA-256|DN"

      - name: Apagar a keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/app.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: dicemaxxing-apk
          path: build/dicemaxxing.apk
          if-no-files-found: error

      # O artefato acima vem dentro de um .zip, que nem todo celular abre. Aqui o .apk
      # vai solto num pré-lançamento por branch (substituído a cada push), com link fixo:
      # releases/download/apk-<branch>/dicemaxxing.apk
      - name: Publicar APK solto (pré-lançamento da branch)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" build/dicemaxxing.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK de debug · $GITHUB_REF_NAME" \
            --notes "APK de debug do commit $GITHUB_SHA (branch $GITHUB_REF_NAME), gerado pelo CI."
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dicemaxxing.apk"

      # Versão nova na branch principal: cria a tag e o release (não é pré-lançamento), que o
      # jogo acha em /releases/latest. Tags criadas pelo token do CI não disparam outro run.
      - name: Publicar release automático (versão nova na branch principal)
        if: env.AUTO_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$APK_VERSION" == *-* ]] && PRE="--prerelease" ## v1.0.0-beta não vira o "latest".
          gh release create "$AUTO_TAG" build/dicemaxxing.apk --target "$GITHUB_SHA" $PRE \
            --title "DICEMAXXING $APK_VERSION" --generate-notes
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$AUTO_TAG/dicemaxxing.apk"

      # Tag v*: release de verdade (não é pré-lançamento), que o jogo acha em /releases/latest
      # e oferece no aviso de "Nova versão disponível".
      - name: Publicar release da tag
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/dicemaxxing.apk --clobber ## Re-run do mesmo job.
          else
            PRE=""
            [[ "$APK_VERSION" == *-* ]] && PRE="--prerelease" ## v1.0.0-beta não vira o "latest".
            gh release create "$GITHUB_REF_NAME" build/dicemaxxing.apk --verify-tag $PRE \
              --title "DICEMAXXING $APK_VERSION" --generate-notes
          fi
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/dicemaxxing.apk"
