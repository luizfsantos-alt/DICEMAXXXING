name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Testes e simulação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Importar projeto
        run: godot --headless --import

      - name: Scripts sem erro de análise
        run: godot --headless -s res://sim/check.gd

      - name: Testes (GUT)
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit

      - name: Simulação de balanceamento
        run: |
          godot --headless -s res://sim/simulate.gd -- --runs=1000 --seed=1 --door=facil | tee simulation.txt
          godot --headless -s res://sim/simulate.gd -- --runs=1000 --seed=1 --door=normal | tee -a simulation.txt
          godot --headless -s res://sim/simulate.gd -- --runs=1000 --seed=1 --door=dificil | tee -a simulation.txt
          for c in minimalist vampire barbarian; do
            godot --headless -s res://sim/simulate.gd -- --runs=500 --seed=1 --door=normal --char=$c | tee -a simulation.txt
          done

      - name: Experimentos (temporário)
        run: |
          for x in "--report" "--hand=-1 --report" "--hand=-2 --report" "--h-mult=2 --report" "--h-bag=6 --report"; do
            for c in sorcerer minimalist vampire barbarian; do
              echo "=== $x · $c"
              godot --headless -s res://sim/simulate.gd -- --runs=500 --seed=1 --door=normal --char=$c $x | grep -v "^Godot Engine"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: simulacao
          path: simulation.txt

  android:
    name: APK de debug
    needs: test
    permissions:
      contents: write ## Publicar o pré-lançamento com o APK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Componentes do Android SDK
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Instalar Godot e templates de exportação
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Keystore de debug
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --import
          mkdir -p build
          godot --headless --export-debug "Android" build/dicemaxxing.apk
          ls -la build
          unzip -l build/dicemaxxing.apk | grep -E "texts_pt_br|\.pck" || (echo "Textos não exportados"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: dicemaxxing-apk
          path: build/dicemaxxing.apk
          if-no-files-found: error

      # O artefato acima vem dentro de um .zip, que nem todo celular abre. Aqui o .apk
      # vai solto num pré-lançamento por branch (substituído a cada push), com link fixo:
      # releases/download/apk-<branch>/dicemaxxing.apk
      - name: Publicar APK solto (pré-lançamento da branch)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" build/dicemaxxing.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK de debug · $GITHUB_REF_NAME" \
            --notes "APK de debug do commit $GITHUB_SHA (branch $GITHUB_REF_NAME), gerado pelo CI."
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dicemaxxing.apk"
